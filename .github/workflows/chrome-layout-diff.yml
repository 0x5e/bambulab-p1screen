name: Chrome Layout Diff

on:
  push:
    branches:
      - "main"
      - "develop/*"
  pull_request:
    branches:
      - "main"
      - "develop/*"
  workflow_dispatch:

jobs:
  layout-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web

      - name: Run layout diff
        id: layout
        continue-on-error: true
        run: npm run test:layout

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-layout-diff-report
          path: |
            chrome-layout-diff-results/*.json
            chrome-layout-diff-results/*.html
            chrome-layout-diff-results/snapshots/
            chrome-layout-diff-results/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on layout differences
        if: steps.layout.outcome == 'failure'
        run: |
          echo "::error::Layout diff detected regressions. See the uploaded artifact for details."
          exit 1
